# ==============================================================================
# Inferenciate Kubernetes Manifest Specification
# ==============================================================================
# Enterprise Kubernetes deployment topology:
# 1. Headless Worker Service: Enables DNS A-record discovery of individual C++ Pod IPs.
# 2. C++ Worker Deployment: Scalable inference pool running ONNX Runtime gRPC workers.
# 3. Java Manager Deployment: Asynchronous Netty API Gateway with dynamic batching.
# 4. Public LoadBalancer Service: External ingress point mapping port 80 to port 8080.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Headless Worker Service (Enables K8s Internal DNS A-Record Discovery)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: inferenciate-worker-headless
spec:
  # Setting clusterIP: None configures a Headless Service.
  # CoreDNS returns individual Pod IP addresses upon DNS query instead of a single virtual IP.
  clusterIP: None
  selector:
    app: inferenciate-worker
  ports:
    - protocol: TCP
      port: 50051

---
# ------------------------------------------------------------------------------
# 2. Worker Deployment (C++ ONNX Inference Engine Pod Pool)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferenciate-worker-cluster
spec:
  # Scale worker replica count to expand cluster tensor inference processing capacity
  replicas: 3
  selector:
    matchLabels:
      app: inferenciate-worker
  template:
    metadata:
      labels:
        app: inferenciate-worker
    spec:
      containers:
        - name: worker-node
          image: inferenciate-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          resources:
            # Memory and CPU resource allocations required for ONNX Runtime tensor execution
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

---
# ------------------------------------------------------------------------------
# 3. Manager Deployment (Java Netty API Gateway & Batch Scheduler)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferenciate-manager-cluster
spec:
  # Scale manager replicas to handle high incoming HTTP client traffic
  replicas: 2
  selector:
    matchLabels:
      app: inferenciate-manager
  template:
    metadata:
      labels:
        app: inferenciate-manager
    spec:
      containers:
        - name: manager-node
          image: inferenciate-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: WORKER_SERVICE_NAME
              # Points to the headless worker service name for Kubernetes DNS lookup
              value: "inferenciate-worker-headless"

---
# ------------------------------------------------------------------------------
# 4. Public API Gateway Service (External Load Balancer Ingress)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: inferenciate-api
spec:
  selector:
    app: inferenciate-manager
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
