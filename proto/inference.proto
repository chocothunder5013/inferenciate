syntax = "proto3";
option java_multiple_files = true;

package inference;

// The interface the C++ Worker will implement and the Java Manager will call.
service InferenceService {
  // Sends a single image payload
  rpc Predict(InferenceRequest) returns (InferenceResponse) {}

  // NEW: Sends a batch of images for high-throughput processing
  rpc PredictBatch(BatchInferenceRequest) returns (BatchInferenceResponse) {}
}

message InferenceRequest {
  string request_id = 1;  // To track the job through the system
  bytes image_data = 2;   // Raw image bytes (e.g., JPEG or raw tensor data)
  int32 width = 3;        // Image dimensions
  int32 height = 4;
  int32 channels = 5;  // e.g., 3 for RGB
}

message InferenceResponse {
  string request_id = 1;
  bool success = 2;          // NEW: Did it work?
  string error_message = 3;  // NEW: Why did it fail?
  string class_label = 4;
  float confidence_score = 5;
  int64 execution_time_ms = 6;
}

// --- NEW BATCH MESSAGES ---

message BatchInferenceRequest {
  string batch_id = 1;
  repeated InferenceRequest requests = 2;
}

message BatchInferenceResponse {
  string batch_id = 1;
  repeated InferenceResponse responses = 2;
}