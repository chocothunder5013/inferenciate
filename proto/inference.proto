syntax = "proto3";
option java_multiple_files = true;

package inference;

/**
 * High-performance gRPC inference service contract.
 * Implemented by native C++ worker nodes (ONNX Runtime engine) and invoked
 * asynchronously by the Java API Gateway / Manager node.
 */
service InferenceService {
  /**
   * Processes a single image inference request.
   * Internally wrapped into a single-element batch by the C++ worker before execution.
   */
  rpc Predict(InferenceRequest) returns (InferenceResponse) {}

  /**
   * Processes an aggregated batch of image requests in a single contiguous tensor execution.
   * Maximizes SIMD vectorization and hardware utilization by performing a single ONNX Session Run.
   */
  rpc PredictBatch(BatchInferenceRequest) returns (BatchInferenceResponse) {}
}

/**
 * Request payload containing raw encoded image byte streams and optional spatial metadata.
 */
message InferenceRequest {
  // Unique job identifier (UUID string) for end-to-end tracing across HTTP, gRPC, and WebSocket boundaries.
  string request_id = 1;

  // Raw binary image data bytes (e.g. encoded JPEG, PNG, or raw byte buffer) to be decoded by STB Image.
  bytes image_data = 2;

  // Target spatial width in pixels (optional hint; C++ worker resizes into 224x224 input tensor).
  int32 width = 3;

  // Target spatial height in pixels (optional hint; C++ worker resizes into 224x224 input tensor).
  int32 height = 4;

  // Color channel count (e.g., 3 for standard RGB / NCHW tensor input format).
  int32 channels = 5;
}

/**
 * Response payload containing model predictions, probability metrics, and per-item execution telemetry.
 */
message InferenceResponse {
  // Unique job identifier matching the corresponding request.
  string request_id = 1;

  // Boolean flag indicating successful inference completion without runtime exceptions.
  bool success = 2;

  // Descriptive error trace if processing failed during image decoding or ONNX execution.
  string error_message = 3;

  // Predicted ImageNet classification label (e.g., "Class 263").
  string class_label = 4;

  // Prediction confidence score normalized via Softmax activation (range: 0.0 to 1.0).
  float confidence_score = 5;

  // Amortized per-image execution latency in milliseconds.
  int64 execution_time_ms = 6;
}

/**
 * Container message bundling multiple individual inference requests into a unified batch.
 */
message BatchInferenceRequest {
  // Unique batch identifier generated by the BatchScheduler or API Gateway.
  string batch_id = 1;

  // Ordered collection of individual job request payloads for batch processing.
  repeated InferenceRequest requests = 2;
}

/**
 * Container message bundling individual prediction responses corresponding to a submitted batch.
 */
message BatchInferenceResponse {
  // Unique batch identifier matching the corresponding BatchInferenceRequest.
  string batch_id = 1;

  // Ordered collection of individual job response payloads containing classification results.
  repeated InferenceResponse responses = 2;
}